name: Auto Sync Development to Main

on:
  push:
    branches:
      - development

concurrency:
  group: sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-to-main:
    name: Sync Development to Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Development into Main and Push
        run: |
          echo "Fetching latest main and development branches..."
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "Remote 'main' branch exists. Fetching origin main:main..."
            git fetch origin main:main
            git checkout main
          else
            echo "Remote 'main' branch does not exist yet. Creating 'main' from 'development'..."
            git checkout -b main
          fi

          echo "Merging development into main..."
          # Try fast-forward first; fallback to clean merge commit with --allow-unrelated-histories if histories diverged
          if ! git merge --ff-only development 2>/dev/null; then
            echo "Fast-forward not possible or histories unrelated, performing merge commit..."
            git merge --no-edit --allow-unrelated-histories -m "chore(release): sync development into main [skip ci]" development
          fi

          echo "Pushing updated main to origin..."
          git push origin main
          echo "Successfully synced development to main!"
